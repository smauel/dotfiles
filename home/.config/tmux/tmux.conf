# set prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# reload config
unbind r
bind C-r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded!"

# number windows and panes from 1 not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g mouse on 
set-option -g focus-events on

# smart pane switching with awareness of vim splits (vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
# C-l is taken by pane navigation, so clear the screen with prefix C-l
bind C-l send-keys 'C-l'

# split panes: - stacks them (horizontal divider), \ puts them side by side (vertical divider)
bind - split-window -v
bind '\' split-window -h

# session keybindings
bind C-s display-popup -T "switch session..." -E "~/.local/bin/tmux-session-switcher"
bind C-x run-shell "tmux kill-session -a" \; display-message "sessions killed!"

# status-bar
set -g status on
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-justify centre
set -g status-left-length 30
set -g status-right-length 60
set -g status-left '#[fg=#a9b1d6]#S'
set -g window-status-format ' #[fg=#a9b1d6]#I:#W '
set -g window-status-current-format '#[fg=#1d2021,bg=#e0af68] #I:#W #[default]'
set -g status-right ' #[fg=#a9b1d6]%Y-%m-%d %H:%M '
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#fabd2f"

